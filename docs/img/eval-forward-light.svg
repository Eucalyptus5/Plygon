<rect x="270" y="231" width="100" height="14" rx="2" fill="#eb6834"/>
<text x="320" y="242" font-size="9" text-anchor="middle" fill="#ffffff">seat 1</text>
<rect x="270" y="248" width="100" height="14" rx="2" fill="#eb6834"/>
<text x="320" y="259" font-size="9" text-anchor="middle" fill="#ffffff">seat 2</text>
<rect x="270" y="265" width="100" height="14" rx="2" fill="#eb6834"/>
<text x="320" y="276" font-size="9" text-anchor="middle" fill="#ffffff">seat 3</text>
