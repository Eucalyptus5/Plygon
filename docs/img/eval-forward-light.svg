<text x="560" y="138" font-size="9" font-weight="600" fill="#2a78d6">active pair</text>
<rect x="434" y="228" width="18" height="16" rx="2" fill="#eb6834"/>
<rect x="454" y="228" width="18" height="16" rx="2" fill="#eb6834"/>
