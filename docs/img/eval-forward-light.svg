<text x="560" y="240" font-size="9" font-weight="600" fill="#eb6834">b_j = B &#183; t_j, their six seats</text>
<path d="M370,141 H409" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#ab)"/>
<path d="M370,265 H400 V236 H431" fill="none" stroke="#eb6834" stroke-width="1.5" marker-end="url(#ao)"/>
