<rect x="24" y="112" width="170" height="48" rx="6" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="109" y="128" font-size="10" font-weight="600" text-anchor="middle" fill="#0b0b0b">acc0 = sum of side 0 seats</text>
<text x="109" y="141" font-size="10" text-anchor="middle" fill="#52514e">+ side 0 side token + global token</text>
<text x="109" y="154" font-size="10" text-anchor="middle" fill="#52514e">then ReLU, width W</text>
<rect x="64" y="241" width="130" height="48" rx="6" fill="none" stroke="#eb6834" stroke-width="1.5"/>
<text x="129" y="257" font-size="10" font-weight="600" text-anchor="middle" fill="#0b0b0b">acc1 = sum of side 1 seats</text>
<text x="129" y="270" font-size="10" text-anchor="middle" fill="#52514e">+ side token + global</text>
<text x="129" y="283" font-size="10" text-anchor="middle" fill="#52514e">then ReLU, width W</text>
<path d="M270,141 H197" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#ab)"/>
<path d="M270,265 H197" fill="none" stroke="#eb6834" stroke-width="1.5" marker-end="url(#ao)"/>
<text x="412" y="96" font-size="9" font-weight="600" fill="#2a78d6">a_i = A &#183; t_i, my six seats</text>
<text x="548" y="96" font-size="9" font-weight="600" fill="#52514e">cells: ReLU(a_i &#8857; b_j), R each</text>
