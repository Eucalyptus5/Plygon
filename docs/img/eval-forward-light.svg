<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The value forward pass. The six side-0 seat tokens, the side-0 side token and the global token are summed into accumulator acc0; side 1's into acc1; both pass through a ReLU. Separately, matrix A projects each of my six seat tokens and matrix B each of their six, and the 36 pairwise products are rectified into a 6 by 6 web of cells; web_total sums all cells and the active cell is the one for the two active Pokemon. The first layer's input is ReLU acc0, ReLU acc1, web_total, the active cell and 7 dense floats, 2W plus 2R plus 7 wide. A chain of fully-connected layers with ReLU between them ends in one output, which a multiplier from the file header puts in the hand evaluator's units. The search squashes it relative to the root's value.">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f6e69"/></marker>
</defs>
<text x="24" y="24" font-size="15" font-weight="600" fill="#0b0b0b">The value forward: two accumulators, a 6 by 6 web, one fully-connected chain</text>
<text x="24" y="44" font-size="12" fill="#52514e">The same 15 tokens feed two paths. The accumulators pool each side; the web compares individual seats across sides.</text>
<text x="270" y="82" font-size="10" fill="#52514e">side 0 seat tokens</text>
<rect x="270" y="90" width="100" height="14" rx="2" fill="#2a78d6"/>
<text x="320" y="101" font-size="9" text-anchor="middle" fill="#ffffff">seat 0</text>
<rect x="270" y="107" width="100" height="14" rx="2" fill="#2a78d6"/>
<text x="320" y="118" font-size="9" text-anchor="middle" fill="#ffffff">seat 1 (active)</text>
<rect x="270" y="124" width="100" height="14" rx="2" fill="#2a78d6"/>
