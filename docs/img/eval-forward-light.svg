<text x="418" y="326" font-size="9" text-anchor="end" fill="#52514e">sum of all 36 cells</text>
<text x="580" y="326" font-size="9" fill="#52514e">the active pair's cell</text>
<rect x="614" y="256" width="82" height="36" rx="4" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="655" y="271" font-size="9" font-weight="600" text-anchor="middle" fill="#0b0b0b">dense channel</text>
<text x="655" y="284" font-size="9" text-anchor="middle" fill="#52514e">7 floats, no table</text>
<path d="M670,292 V337" fill="none" stroke="#6f6e69" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="60" y="334" font-size="10" fill="#0b0b0b">the first layer's input x, 2W + 2R + 7 wide</text>
<rect x="24" y="340" width="160" height="26" rx="3" fill="#2a78d6"/>
<text x="104" y="357" font-size="10" text-anchor="middle" fill="#ffffff">ReLU(acc0), W</text>
<rect x="184" y="340" width="160" height="26" rx="3" fill="#eb6834"/>
<text x="264" y="357" font-size="10" text-anchor="middle" fill="#ffffff">ReLU(acc1), W</text>
<rect x="344" y="340" width="160" height="26" rx="3" fill="#6f6e69"/>
<text x="424" y="357" font-size="10" text-anchor="middle" fill="#ffffff">web_total, R</text>
<rect x="504" y="340" width="140" height="26" rx="3" fill="#6f6e69" opacity="0.55"/>
<text x="574" y="357" font-size="10" text-anchor="middle" fill="#ffffff">active cell, R</text>
<rect x="644" y="340" width="52" height="26" rx="3" fill="none" stroke="#6f6e69" stroke-width="1.5"/>
<text x="670" y="357" font-size="10" text-anchor="middle" fill="#0b0b0b">dense 7</text>
<path d="M84,366 V395" fill="none" stroke="#6f6e69" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="24" y="398" width="120" height="28" rx="4" fill="none" stroke="#6f6e69" stroke-width="1.5"/>
<text x="84" y="416" font-size="10" text-anchor="middle" fill="#0b0b0b">fc, ReLU</text>
<path d="M144,412 H165" fill="none" stroke="#6f6e69" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="168" y="398" width="120" height="28" rx="4" fill="none" stroke="#6f6e69" stroke-width="1.5"/>
<text x="228" y="416" font-size="10" text-anchor="middle" fill="#0b0b0b">fc, ReLU</text>
<path d="M288,412 H305" fill="none" stroke="#6f6e69" stroke-width="1.5"/>
<text x="318" y="416" font-size="12" text-anchor="middle" fill="#52514e">&#8230;</text>
<path d="M331,412 H349" fill="none" stroke="#6f6e69" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="352" y="398" width="130" height="28" rx="4" fill="none" stroke="#6f6e69" stroke-width="1.5"/>
<text x="417" y="416" font-size="10" text-anchor="middle" fill="#0b0b0b">fc, one output</text>
<path d="M482,412 H503" fill="none" stroke="#6f6e69" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="506" y="398" width="110" height="28" rx="4" fill="none" stroke="#6f6e69" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="561" y="416" font-size="10" text-anchor="middle" fill="#0b0b0b">&#215; multiplier</text>
<path d="M616,412 H637" fill="none" stroke="#6f6e69" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="640" y="398" width="56" height="28" rx="4" fill="#6f6e69"/>
<text x="668" y="416" font-size="10" text-anchor="middle" fill="#ffffff">logit</text>
<text x="24" y="446" font-size="10" fill="#52514e">Layer count and widths come from the file header. Hidden layers use ReLU; the output does not. The multiplier is in the header too.</text>
<text x="24" y="470" font-size="11" fill="#0b0b0b">The search then does what it does for the hand evaluator: leaf value = sigmoid((logit &#8722; root logit) / temperature).</text>
<text x="24" y="494" font-size="11" fill="#52514e">W is the accumulator width and R the web rank, both read from the header. The loader refuses a file whose first layer is not</text>
<text x="24" y="509" font-size="11" fill="#52514e">2W + 2R + 7 wide or whose last layer is not 1 wide. The active cell is all zeros when either side has no active Pokemon.</text>
<text x="24" y="531" font-size="12" fill="#0b0b0b">The ReLU inside each cell is load-bearing: without it the 36 products sum to one product of two pooled sides.</text>
</svg>
