<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="720" height="516" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="BattleState is 664 bytes: two 324-byte sides plus 16 bytes of field and bookkeeping. One side is a 76-byte active Pokemon, a 228-byte team of six, and 20 bytes of side conditions. The active Pokemon is 4 bytes of volatile flags, 38 bytes of u16 overrides and last-move state, 27 bytes of boosts and turn counters, 5 padding bytes that carry state, and 2 alignment bytes.">
<text x="24" y="24" font-size="15" font-weight="600" fill="#0b0b0b">One battle position is 664 contiguous bytes</text>
<text x="24" y="44" font-size="12" fill="#52514e">Segment width is proportional to size. Copying the whole thing is one memcpy.</text>
<text x="24" y="70" font-size="12" font-weight="600" fill="#0b0b0b">BattleState, 664 bytes</text>
<rect x="24.0" y="78" width="325.9" height="44" rx="4" fill="#2a78d6"/>
<text x="187.0" y="99" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">player 1 side</text>
<text x="187.0" y="114" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.88">324 bytes</text>
<rect x="351.9" y="78" width="325.9" height="44" rx="4" fill="#2a78d6"/>
<text x="514.9" y="99" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">player 2 side</text>
<text x="514.9" y="114" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.88">324 bytes</text>
<rect x="679.8" y="78" width="14.2" height="44" rx="4" fill="#6f6e69"/>
<text x="696" y="140" font-size="11" text-anchor="end" fill="#52514e">grey: 16 bytes of weather, terrain, turn count and both pending actions</text>
<text x="24" y="180" font-size="12" font-weight="600" fill="#0b0b0b">one of those sides, expanded &#8212; 324 bytes</text>
<rect x="24.0" y="188" width="155.6" height="44" rx="4" fill="#eb6834"/>
<text x="101.8" y="209" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">active Pokemon</text>
<text x="101.8" y="224" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.88">76 bytes</text>
<rect x="181.6" y="188" width="470.9" height="44" rx="4" fill="#1baf7a"/>
<text x="417.1" y="209" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">team of six</text>
<text x="417.1" y="224" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.88">228 bytes</text>
<rect x="654.5" y="188" width="39.5" height="44" rx="4" fill="#6f6e69"/>
<text x="696" y="250" font-size="11" text-anchor="end" fill="#52514e">grey: 20 bytes of hazards, screens and bookkeeping</text>
<text x="24" y="250" font-size="11" fill="#52514e">team = six 38-byte records</text>
<text x="24" y="292" font-size="12" font-weight="600" fill="#0b0b0b">the active Pokemon, expanded &#8212; 76 bytes</text>
<rect x="24.0" y="300" width="34.8" height="44" rx="4" fill="#2a78d6"/>
<rect x="60.8" y="300" width="331.0" height="44" rx="4" fill="#eb6834"/>
<text x="226.3" y="321" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">u16 overrides and last-move state</text>
<text x="226.3" y="336" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.88">38 bytes</text>
<rect x="393.8" y="300" width="235.2" height="44" rx="4" fill="#1baf7a"/>
<text x="511.4" y="321" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">boosts and turn counters</text>
<text x="511.4" y="336" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.88">27 bytes</text>
<rect x="631.0" y="300" width="43.6" height="44" rx="4" fill="#6f6e69"/>
<rect x="676.6" y="300" width="17.4" height="44" rx="4" fill="#6f6e69" opacity="0.35"/>
<text x="24" y="362" font-size="11" fill="#52514e">blue: 32 volatile flags in 4 bytes</text>
<text x="696" y="362" font-size="11" text-anchor="end" fill="#52514e">grey: 5 padding bytes, listed below, then 2 alignment bytes that hold nothing</text>
<text x="696" y="386" font-size="11" font-weight="600" text-anchor="end" fill="#52514e">what the 5 padding bytes hold</text>
<text x="696" y="402" font-size="11" text-anchor="end" fill="#52514e">byte 0: Baton Pass pending, Protect variant, stats-split active, Truant loaf</text>
<text x="696" y="418" font-size="11" text-anchor="end" fill="#52514e">byte 1: charge location (air, underground, underwater, vanished)</text>
<text x="696" y="434" font-size="11" text-anchor="end" fill="#52514e">byte 2: move-lock turns remaining</text>
<text x="696" y="450" font-size="11" text-anchor="end" fill="#52514e">byte 3: Protean, attract, Paradox booster, No Retreat, Paradox boosted stat</text>
<text x="696" y="466" font-size="11" text-anchor="end" fill="#52514e">byte 4: Disguise/Ice Face broken, charge, bind turns</text>
<text x="24" y="496" font-size="12" fill="#0b0b0b">Every size here is asserted at compile time, so the struct cannot silently grow.</text>
</svg>
