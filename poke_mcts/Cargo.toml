[package]
name = "poke_mcts"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ab_chance"

[[bin]]
name = "premise_vhat"
required-features = ["train_value"]

[features]
train_value = []

[dependencies]
bincode = "1"
pkmn-engine = { path = "../pkmn-engine" }
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"

